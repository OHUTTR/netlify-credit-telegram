<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>نموذج بطاقة الائتمان</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --border: #dfe3e8;
      --text: #252d3d;
      --muted: #5d6778;
      --accent: #1bb1a6;
      --accent-dark: #0d8f85;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: Tahoma, Arial, sans-serif;
      direction: rtl;
      color: var(--text);
    }

    .box {
      width: min(92vw, 440px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 26px 28px 18px;
      box-shadow: 0 1px 0 rgba(16, 24, 40, 0.02);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
      color: var(--text);
    }

    .text {
      font-size: 1.02rem;
      line-height: 1.9;
      text-align: center;
      color: var(--text);
      margin: 0 auto 18px;
      max-width: 30ch;
    }

    .text strong {
      font-weight: 700;
    }

    .note {
      margin: 0;
      font-size: 0.95rem;
      text-align: center;
      line-height: 1.9;
      color: var(--muted);
    }

    .note a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    .note a:hover { color: var(--accent-dark); }
  </style>
</head>
<body>
  <div class="box">
    <h1>الصفحة غير موجودة</h1>

    <p class="text">
      يبدو أن الرابط الذي طلبته غير صحيح<br>
      أو أن الصفحة التي تبحث عنها قد تم نقلها أو حذفها.
    </p>

    <p class="note">
      إذا كنت تتوقع هذه الصفحة، تأكد من عنوان الرابط، أو<br>
      اذهب إلى <a href="/">الصفحة الرئيسية</a>.
    </p>
  </div>
</body>
</html>
